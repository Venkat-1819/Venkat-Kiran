<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cute Kitten SVG -->
  <circle cx="100" cy="100" r="90" fill="#ff7dbd" opacity="0.15" />
  <!-- Ears -->
  <polygon points="40,70 25,25 70,45" fill="#f4a261" stroke="#2b2d42" stroke-width="2" />
  <polygon points="43,62 33,35 62,48" fill="#ffccd5" />
  <polygon points="160,70 175,25 130,45" fill="#f4a261" stroke="#2b2d42" stroke-width="2" />
  <polygon points="157,62 167,35 138,48" fill="#ffccd5" />
  <!-- Body -->
  <ellipse cx="100" cy="150" rx="45" ry="38" fill="#f4a261" stroke="#2b2d42" stroke-width="2" />
  <ellipse cx="100" cy="155" rx="28" ry="24" fill="#ffffff" />
  <!-- Head -->
  <circle cx="100" cy="90" r="46" fill="#f4a261" stroke="#2b2d42" stroke-width="2" />
  <!-- Eyes -->
  <ellipse cx="76" cy="85" rx="8" ry="11" fill="#2b2d42" />
  <ellipse cx="124" cy="85" rx="8" ry="11" fill="#2b2d42" />
  <circle cx="74" cy="81" r="3.5" fill="#ffffff" />
  <circle cx="122" cy="81" r="3.5" fill="#ffffff" />
  <circle cx="78" cy="88" r="1.5" fill="#ffffff" />
  <circle cx="126" cy="88" r="1.5" fill="#ffffff" />
  <!-- Nose & Mouth -->
  <polygon points="96,96 104,96 100,101" fill="#ff758c" />
  <path d="M 94 103 Q 100 108 106 103" stroke="#2b2d42" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Whiskers -->
  <line x1="55" y1="92" x2="30" y2="88" stroke="#2b2d42" stroke-width="2" stroke-linecap="round" />
  <line x1="55" y1="98" x2="28" y2="98" stroke="#2b2d42" stroke-width="2" stroke-linecap="round" />
  <line x1="145" y1="92" x2="170" y2="88" stroke="#2b2d42" stroke-width="2" stroke-linecap="round" />
  <line x1="145" y1="98" x2="172" y2="98" stroke="#2b2d42" stroke-width="2" stroke-linecap="round" />
  <!-- Blush -->
  <ellipse cx="64" cy="96" rx="7" ry="4" fill="#ff758c" opacity="0.5" />
  <ellipse cx="136" cy="96" rx="7" ry="4" fill="#ff758c" opacity="0.5" />
</svg>
