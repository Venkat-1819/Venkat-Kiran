<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="pandaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Aura -->
  <circle cx="100" cy="100" r="90" fill="#ff7dbd" opacity="0.15" filter="url(#pandaGlow)" />
  <!-- Ears -->
  <circle cx="48" cy="52" r="26" fill="#1e1b2e" />
  <circle cx="48" cy="52" r="14" fill="#ff7dbd" opacity="0.4" />
  <circle cx="152" cy="52" r="26" fill="#1e1b2e" />
  <circle cx="152" cy="52" r="14" fill="#ff7dbd" opacity="0.4" />
  <!-- Body -->
  <ellipse cx="100" cy="148" rx="55" ry="44" fill="#ffffff" stroke="#1e1b2e" stroke-width="3" />
  <!-- Arms / Shoulders -->
  <path d="M 48 122 C 45 155 155 155 152 122 C 132 110 68 110 48 122 Z" fill="#1e1b2e" />
  <!-- Gift Box in Paws -->
  <rect x="80" y="130" width="40" height="35" rx="6" fill="#ff4f9d" />
  <rect x="95" y="130" width="10" height="35" fill="#ffd7ec" />
  <rect x="80" y="142" width="40" height="10" fill="#ffd7ec" />
  <!-- Bow -->
  <circle cx="100" cy="128" r="6" fill="#ff1493" />
  <path d="M 90 124 Q 100 128 94 133 Z" fill="#ff1493" />
  <path d="M 110 124 Q 100 128 106 133 Z" fill="#ff1493" />
  <!-- Head -->
  <circle cx="100" cy="88" r="48" fill="#ffffff" stroke="#1e1b2e" stroke-width="3" />
  <!-- Eye Patches -->
  <ellipse cx="76" cy="86" rx="16" ry="14" fill="#1e1b2e" transform="rotate(-15 76 86)" />
  <ellipse cx="124" cy="86" rx="16" ry="14" fill="#1e1b2e" transform="rotate(15 124 86)" />
  <!-- Eyes -->
  <circle cx="76" cy="86" r="6" fill="#ffffff" />
  <circle cx="124" cy="86" r="6" fill="#ffffff" />
  <circle cx="77" cy="87" r="3.5" fill="#1e1b2e" />
  <circle cx="125" cy="87" r="3.5" fill="#1e1b2e" />
  <circle cx="75" cy="84" r="1.5" fill="#ffffff" />
  <circle cx="123" cy="84" r="1.5" fill="#ffffff" />
  <!-- Snout/Nose -->
  <ellipse cx="100" cy="100" rx="8" ry="5" fill="#1e1b2e" />
  <ellipse cx="98" cy="98" rx="2" ry="1" fill="#ffffff" />
  <!-- Mouth -->
  <path d="M 94 105 Q 100 110 106 105" stroke="#1e1b2e" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <!-- Cute Blush -->
  <ellipse cx="62" cy="96" rx="8" ry="5" fill="#ff4f9d" opacity="0.5" />
  <ellipse cx="138" cy="96" rx="8" ry="5" fill="#ff4f9d" opacity="0.5" />
</svg>
