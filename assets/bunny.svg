<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Cute Bunny SVG -->
  <circle cx="100" cy="100" r="90" fill="#ff7dbd" opacity="0.15" />
  <!-- Long Ears -->
  <ellipse cx="70" cy="40" rx="14" ry="42" fill="#ffffff" stroke="#2b2d42" stroke-width="2" transform="rotate(-10 70 40)" />
  <ellipse cx="70" cy="40" rx="8" ry="30" fill="#ffccd5" transform="rotate(-10 70 40)" />
  <ellipse cx="130" cy="40" rx="14" ry="42" fill="#ffffff" stroke="#2b2d42" stroke-width="2" transform="rotate(10 130 40)" />
  <ellipse cx="130" cy="40" rx="8" ry="30" fill="#ffccd5" transform="rotate(10 130 40)" />
  <!-- Body -->
  <ellipse cx="100" cy="152" rx="42" ry="36" fill="#ffffff" stroke="#2b2d42" stroke-width="2" />
  <ellipse cx="100" cy="155" rx="26" ry="22" fill="#fff0f5" />
  <!-- Head -->
  <circle cx="100" cy="102" r="44" fill="#ffffff" stroke="#2b2d42" stroke-width="2" />
  <!-- Eyes -->
  <circle cx="78" cy="98" r="8" fill="#2b2d42" />
  <circle cx="122" cy="98" r="8" fill="#2b2d42" />
  <circle cx="76" cy="95" r="3.5" fill="#ffffff" />
  <circle cx="120" cy="95" r="3.5" fill="#ffffff" />
  <!-- Nose & Mouth -->
  <ellipse cx="100" cy="106" rx="4" ry="3" fill="#ff758c" />
  <path d="M 96 110 Q 100 114 104 110" stroke="#2b2d42" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Cheeks/Blush -->
  <ellipse cx="66" cy="108" rx="8" ry="5" fill="#ff758c" opacity="0.5" />
  <ellipse cx="134" cy="108" rx="8" ry="5" fill="#ff758c" opacity="0.5" />
  <!-- Heart held by Bunny -->
  <path d="M 100 142 C 100 135 90 130 84 136 C 78 142 88 152 100 158 C 112 152 122 142 116 136 C 110 130 100 135 100 142 Z" fill="#ff1493" opacity="0.95" />
</svg>
